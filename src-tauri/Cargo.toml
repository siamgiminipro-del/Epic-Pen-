[package]
name = "epic-pen"
version = "0.1.0"
description = "Epic Pen screen annotation tool"
authors = ["siamgiminipro-del"]
edition = "2021"

[lib]
name = "epic_pen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
